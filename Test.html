<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Min aktieportefølje</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .portfolio {
            max-width: 700px;
            margin: 0 auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 450px;
        }

        .portfolio-total {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <main class="portfolio">
        <h1>Min aktieportefølje</h1>

        <div class="chart-container">
            <canvas id="portfolioChart"></canvas>
        </div>

        <div class="portfolio-total" id="portfolioTotal"></div>
    </main>

    <script>
        const stocks = [
            {
                symbol: "AAPL",
                name: "Apple",
                quantity: 10,
                price: 1450
            },
            {
                symbol: "MSFT",
                name: "Microsoft",
                quantity: 6,
                price: 2800
            },
            {
                symbol: "NOVO-B",
                name: "Novo Nordisk",
                quantity: 20,
                price: 340
            },
            {
                symbol: "TSLA",
                name: "Tesla",
                quantity: 8,
                price: 2100
            }
        ];

        const portfolioData = stocks.map(stock => ({
            ...stock,
            marketValue: stock.quantity * stock.price
        }));

        const totalValue = portfolioData.reduce(
            (total, stock) => total + stock.marketValue,
            0
        );

        const labels = portfolioData.map(stock => stock.symbol);
        const values = portfolioData.map(stock => stock.marketValue);

        const canvas = document.getElementById("portfolioChart");

        new Chart(canvas, {
            type: "doughnut",

            data: {
                labels: labels,

                datasets: [{
                    label: "Markedsværdi",
                    data: values,

                    backgroundColor: [
                        "#2563eb",
                        "#16a34a",
                        "#f59e0b",
                        "#dc2626",
                        "#9333ea",
                        "#0891b2"
                    ],

                    borderColor: "#ffffff",
                    borderWidth: 3,
                    hoverOffset: 12
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                cutout: "55%",

                plugins: {
                    legend: {
                        position: "bottom"
                    },

                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const stock = portfolioData[context.dataIndex];
                                const percentage =
                                    stock.marketValue / totalValue * 100;

                                return [
                                    `${stock.name}`,
                                    `Værdi: ${formatCurrency(stock.marketValue)}`,
                                    `Andel: ${percentage.toFixed(1)} %`,
                                    `Antal: ${stock.quantity}`
                                ];
                            }
                        }
                    }
                }
            }
        });

        document.getElementById("portfolioTotal").textContent =
            `Samlet værdi: ${formatCurrency(totalValue)}`;

        function formatCurrency(value) {
            return new Intl.NumberFormat("da-DK", {
                style: "currency",
                currency: "DKK",
                maximumFractionDigits: 0
            }).format(value);
        }
    </script>

</body>
</html>
