<!DOCTYPE html>
<html>

<head>
    <title>InvestingTracker</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/exchangeRateInfo.css">

</head>

<body>

    <div class="container">
        <a href="index.html" class="mainTitle">
            <h1>InvestingTracker</h1>
        </a>

        <div id="titleContainer">

        </div>

        <form id="dividendForm">

            <datalist id="currencyDatalist"></datalist>

            <div id="accountIdContainer">
                <div class="customLabel">Konto</div>
                <select id="accountId" class="customControl" required>
                </select>
            </div>

            <div>
                <div class="customLabel">Børsmægler</div>
                <select id="stockBrokerName" class="customControl" required>
                </select>
            </div>

            <div>
                <div class="customLabel">Dato</div>
                <input type="date" id="date" class="customControl" placeholder="dd-mm-yyyy" required>
            </div>

            <div>
                <div class="customLabel">Antal aktier</div>
                <input type="number" id="numberOfShares" class="customControl" required>
            </div>

            <div class="split2">
                <div>
                    <div class="customLabel">Udbytte</div>
                    <input type="number" step="0.01" id="dividendValue" class="customControl" required>
                </div>

                <div>
                    <div class="customLabel">Valuta</div>
                    <input list="currencyDatalist" id="dividendCurrency" class="customControl" required>
                </div>

            </div>

            <div id="dividendExchangeRateInfo">
            </div>


            <button type="submit" class="customControl" id="submitButton">
                Gem
            </button>

            <div class="message" id="message"></div>

        </form>
    </div>

    <script type="module" src="javascripts/dividend.js"></script>

</body>

</html>
